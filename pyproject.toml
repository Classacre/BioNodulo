[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bionodulo"
version = "0.1.0a9"
description = "Visual bioinformatics pipelines, node by node."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "BioNodulo Contributors" },
]
keywords = ["bioinformatics", "workflow", "pipeline", "visual"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "packaging>=23.2",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "aiofiles>=23.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "psutil>=5.9.0",
    "biopython>=1.83",
    "uvloop>=0.19.0; sys_platform != 'win32'",
    "pycrdt>=0.12.0",
    "pyjwt>=2.8.0",
    "diskcache>=5.6.3",
    "slowapi>=0.1.9",
    "casbin>=1.36.0",
    "pycrdt-websocket>=0.16.1",
    "pycrdt-store>=0.1.4",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "fastapi-users>=15.0.0",
    "langchain>=1.0.0",
    "langgraph>=1.0.0",
    "litellm>=1.60.0",
    "arq>=0.28.0",
    "redis>=5.0.0",
    "mangum>=0.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # Parallel test execution. The suite is 7000+ tests and CI's slowest leg
    # spent ~15 min in `pytest` alone. Verified parallel-safe: two `-n auto`
    # runs and one serial run all report exactly 7070 passed / 5 skipped.
    "pytest-xdist>=3.5",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]
collab = []
# Paper -> Markdown conversion for the AI assistant. Optional because the
# assistant degrades to plain text extraction without it, and markitdown pulls a
# sizeable dependency tree that a headless worker never needs.
papers = [
    "markitdown[pdf,docx,xlsx]>=0.1.1",
]

[project.scripts]
bionodulo = "main:main"

[tool.hatch.build.targets.wheel]
packages = ["bionodulo"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
