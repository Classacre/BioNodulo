[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bionodulo"
version = "0.1.5"
description = "Visual bioinformatics pipelines, node by node."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "BioNodulo Contributors" },
]
keywords = ["bioinformatics", "workflow", "pipeline", "visual"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "aiofiles>=23.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "psutil>=5.9.0",
    "biopython>=1.83",
    "uvloop>=0.19.0",
    "pycrdt>=0.12.0",
    "pyjwt>=2.8.0",
    "diskcache>=5.6.3",
    "slowapi>=0.1.9",
    "casbin>=1.36.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.2.0", "mypy>=1.8.0"]
collab = []

[project.scripts]
bionodulo = "main:main"

[tool.hatch.build.targets.wheel]
packages = ["bionodulo"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"
