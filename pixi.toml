[workspace]
name = "bionodulo"
version = "0.1.3"
description = "Visual bioinformatics pipelines, node by node."
authors = ["BioNodulo Team <team@bionodulo.org>"]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

# Core Python runtime
[dependencies]
python = ">=3.11"

# Python application dependencies from PyPI
[pypi-dependencies]
fastapi = ">=0.110.0"
uvicorn = { version = ">=0.27.0", extras = ["standard"] }
pydantic = ">=2.6.0"
python-multipart = ">=0.0.9"
websockets = ">=12.0"
aiofiles = ">=23.0"
pyyaml = ">=6.0.1"
httpx = ">=0.27.0"
psutil = ">=5.9.0"
biopython = ">=1.83"
uvloop = ">=0.19.0"

# Development dependencies
[feature.dev.pypi-dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.23"
ruff = ">=0.2.0"
mypy = ">=1.8.0"

[environments]
default = { features = ["dev"] }
