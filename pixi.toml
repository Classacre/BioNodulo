[workspace]
name = "bionodulo"
version = "0.1.3"
description = "Visual bioinformatics pipelines, node by node."
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

# Core Python runtime (shared across all environments)
[dependencies]
python = ">=3.11"

# Python application dependencies from PyPI
[pypi-dependencies]
fastapi = ">=0.110.0"
uvicorn = { version = ">=0.27.0", extras = ["standard"] }
pydantic = ">=2.6.0"
python-multipart = ">=0.0.9"
websockets = ">=12.0"
aiofiles = ">=23.0"
pyyaml = ">=6.0.1"
httpx = ">=0.27.0"
psutil = ">=5.9.0"
biopython = ">=1.83"
uvloop = ">=0.19.0"

# Development dependencies
[feature.dev.pypi-dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.23"
ruff = ">=0.2.0"
mypy = ">=1.8.0"

# ------------------------------------------------------------------------------
# Per-category bioinformatics tool features
# ------------------------------------------------------------------------------

[feature.alignment.dependencies]
bwa = "*"
bowtie2 = "*"
hisat2 = "*"
minimap2 = "*"
star = "*"

[feature.assembly.dependencies]
spades = "*"
megahit = "*"
flye = "*"
canu = "*"
quast = "*"

[feature.rna-seq.dependencies]
salmon = "*"
kallisto = "*"
stringtie = "*"
subread = "*"

[feature.variant.dependencies]
gatk4 = "*"
bcftools = "*"
freebayes = "*"
vcftools = "*"

[feature.metagenomics.dependencies]
kraken2 = "*"
bracken = "*"
metaphlan = "*"
humann = "*"
checkm-genome = "*"
maxbin2 = "*"

[feature.phylogeny.dependencies]
iqtree = "*"
raxml = "*"
mafft = "*"
clustalo = "*"
fasttree = "*"

[feature.qc.dependencies]
fastqc = "*"
multiqc = "*"
qualimap = "*"
fastp = "*"
trimmomatic = "*"

[feature.annotation.dependencies]
prokka = "*"
bakta = "*"
eggnog-mapper = "*"

[feature.chip-seq.dependencies]
macs2 = "*"
bedtools = "*"
deeptools = "*"

[feature.single-cell.dependencies]
# cellranger is Linux-only and not available on conda-forge/bioconda for all platforms.
# Install manually if needed: https://support.10xgenomics.com/single-cell-gene-expression/software/downloads/latest

[feature.trimming.dependencies]
cutadapt = "*"
trimmomatic = "*"

[feature.samtools.dependencies]
samtools = "*"
bcftools = "*"

[feature.r.dependencies]
r-base = ">=4.3"
r-ggplot2 = "*"
r-dplyr = "*"
r-tidyr = "*"
r-readr = "*"
r-pheatmap = "*"
r-ape = "*"
r-vegan = "*"
r-rcolorbrewer = "*"
bioconductor-deseq2 = "*"
bioconductor-edger = "*"
bioconductor-limma = "*"
bioconductor-biostrings = "*"
bioconductor-genomicranges = "*"
bioconductor-rtracklayer = "*"
bioconductor-summarizedexperiment = "*"
bioconductor-tximport = "*"
bioconductor-complexheatmap = "*"

[feature.hpc.dependencies]
# HPC nodes have no conda-specific dependencies

# ------------------------------------------------------------------------------
# Environment definitions
# Each environment is a prefix containing the base deps + its feature deps.
# ------------------------------------------------------------------------------
[environments]
default = { features = ["dev"] }
tools = { features = [] }
alignment = { features = ["alignment"] }
assembly = { features = ["assembly"] }
rna-seq = { features = ["rna-seq"] }
variant = { features = ["variant"] }
metagenomics = { features = ["metagenomics"] }
phylogeny = { features = ["phylogeny"] }
qc = { features = ["qc"] }
annotation = { features = ["annotation"] }
chip-seq = { features = ["chip-seq"] }
single-cell = { features = ["single-cell"] }
trimming = { features = ["trimming"] }
samtools = { features = ["samtools"] }
r = { features = ["r"] }
hpc = { features = ["hpc"] }
