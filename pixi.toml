[workspace]
name = "bionodulo"
version = "0.1.5"
description = "Visual bioinformatics pipelines, node by node."
authors = ["BioNodulo Team <team@bionodulo.org>"]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "linux-aarch64"]

# Core Python runtime
[dependencies]
python = ">=3.12,<3.13"

# -----------------------------------------------------------------------------
# Base app dependencies — the LIGHT set the cloud WORKER's eager import path
# actually needs (bionodulo.execution/nodes + registry walk). Heavy bio/ML libs
# (scanpy, transformers, pysam, litellm, …) are NOT here: nodes install them at
# runtime via REQUIRED_CONDA_PACKAGES / embedded command scripts. The server/
# collab/LLM/auth/DB/queue stack lives in the `server` feature below so the
# worker image can exclude it (§38 image slim: 301MB → target <150MB).
# -----------------------------------------------------------------------------
[pypi-dependencies]
pyyaml = ">=6.0.1"
httpx = ">=0.27.0"
diskcache = ">=5.6.3"
# biopython is a small, foundational LIBRARY (not a heavy bio tool) that the
# entire `biopython` node category imports IN-PROCESS (from Bio import ...).
# In-process nodes can't use the runtime REQUIRED_CONDA_PACKAGES install path,
# so it must live in the worker's own env. Kept minimal — heavy tools (BWA,
# GATK, STAR, scanpy, …) still install on demand per workflow.
biopython = ">=1.83"
# matplotlib: same rationale — several in-process viz nodes (bp_msa_view and
# other BaseNode renderers) import it directly to emit PNGs. Small, foundational
# plotting lib; belongs in the worker base env so those nodes don't ImportError.
matplotlib = ">=3.8"

# -----------------------------------------------------------------------------
# Server-only stack: the editor/API server, live collaboration, LLM
# orchestration, auth, DB, and the ARQ queue. The cloud worker does NOT import
# any of these (verified §38) — it drives WorkflowExecutor directly.
# -----------------------------------------------------------------------------
[feature.server.pypi-dependencies]
fastapi = ">=0.110.0"
uvicorn = { version = ">=0.27.0", extras = ["standard"] }
pydantic = ">=2.6.0"
biopython = ">=1.83"
python-multipart = ">=0.0.9"
websockets = ">=12.0"
aiofiles = ">=23.0"
psutil = ">=5.9.0"
uvloop = ">=0.19.0"
pycrdt = ">=0.12.0"
pyjwt = ">=2.8.0"
slowapi = ">=0.1.9"
casbin = ">=1.36.0"
pycrdt-websocket = ">=0.16.1"
pycrdt-store = ">=0.1.4"
sqlalchemy = ">=2.0.0"
alembic = ">=1.13.0"
fastapi-users = ">=15.0.0"
langchain = ">=1.0.0"
langgraph = ">=1.0.0"
litellm = ">=1.60.0"
arq = ">=0.28.0"
redis = ">=5.0.0"

# Development dependencies
[feature.dev.pypi-dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.23"
ruff = ">=0.2.0"
mypy = ">=1.8.0"

[environments]
# default: the full app (server + dev) — used by the editor/server build + local
# dev. Unchanged behaviour for everything except the cloud worker image.
default = { features = ["server", "dev"] }
# worker: the SLIM cloud-worker env — base deps only, no server/collab/LLM/dev.
worker = { features = [] }
