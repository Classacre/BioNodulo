[workspace]
name = "bionodulo"
version = "0.1.5"
description = "Visual bioinformatics pipelines, node by node."
authors = ["BioNodulo Team <team@bionodulo.org>"]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "linux-aarch64"]

# Core Python runtime
[dependencies]
python = ">=3.12,<3.13"

# Python application dependencies from PyPI
[pypi-dependencies]
fastapi = ">=0.110.0"
uvicorn = { version = ">=0.27.0", extras = ["standard"] }
pydantic = ">=2.6.0"
python-multipart = ">=0.0.9"
websockets = ">=12.0"
aiofiles = ">=23.0"
pyyaml = ">=6.0.1"
httpx = ">=0.27.0"
psutil = ">=5.9.0"
biopython = ">=1.83"
uvloop = ">=0.19.0"
pycrdt = ">=0.12.0"
pyjwt = ">=2.8.0"
diskcache = ">=5.6.3"
slowapi = ">=0.1.9"
casbin = ">=1.36.0"
pycrdt-websocket = ">=0.16.1"
pycrdt-store = ">=0.1.4"
sqlalchemy = ">=2.0.0"
alembic = ">=1.13.0"
fastapi-users = ">=15.0.0"
langchain = ">=1.0.0"
langgraph = ">=1.0.0"
litellm = ">=1.60.0"
arq = ">=0.28.0"
redis = ">=5.0.0"

# Development dependencies
[feature.dev.pypi-dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.23"
ruff = ">=0.2.0"
mypy = ">=1.8.0"

[environments]
default = { features = ["dev"] }
