[workspace]
name = "bionodulo-workflow"
version = "0.1.0"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
bcftools = "1.24"
bwa = "0.7.19"
delly = "1.2.6"
fastp = "0.24.0"
fastqc = "0.12.1"
freebayes = "1.3.10"
htslib = "1.23.1"
multiqc = "1.33"
openjdk = ">=17"
pybigwig = "0.3.24"
pysam = "0.23.3"
samtools = "1.23.1"
snpeff = "5.2"

[feature.manta.dependencies]
manta = "1.6.0"

[environments]
manta = { features = ["manta"], no-default-feature = true }
