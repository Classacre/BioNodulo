[workspace]
name = "bionodulo-workflow"
version = "0.1.0"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
bedtools = "2.31.1"
bowtie2 = "2.5.5"
deeptools = "3.5.6"
fastp = "0.24.0"
fastqc = "0.12.1"
multiqc = "1.33"
pybigwig = "0.3.24"
pysam = "0.23.3"
samtools = "==1.23.1"

[feature.macs2.dependencies]
macs2 = { version = "2.2.9.1", build = "py311hdad781d_1" }

[environments]
macs2 = { features = ["macs2"], no-default-feature = true }
