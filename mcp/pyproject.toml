[project]
name = "bionodulo-mcp"
version = "0.1.0"
description = "MCP server for the BioNodulo platform: account, runs, workflows, billing, files, hosted AI, and the local desktop execution engine"
readme = "README.md"
authors = [
    { name = "classacre", email = "nieuwenhuyzenmikamartin@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3.4.7",
    "httpx>=0.28.1",
]

[project.scripts]
bionodulo-mcp = "bionodulo_mcp.server:main"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"
