[package]
name = "bionodulo-desktop"
version = "0.1.0-alpha.57"
description = "BioNodulo Desktop"
authors = ["BioNodulo"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "rt", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
log = "0.4"
once_cell = "1"

# NOTE: `desktop` is a cfg Tauri injects for rustc only — Cargo does NOT know it
# and would silently skip these deps under `[target.'cfg(desktop)'...]`. Use a
# predicate Cargo evaluates (everything that is not mobile) so the crates link.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal"] }

[dev-dependencies]
# The WSL smoke test drives real processes and polls the backend over HTTP, so
# it needs a multi-threaded runtime and a client the lib does not enable.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
