<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BioNodulo</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        height: 100vh; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 32px;
        font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
        background: radial-gradient(1200px 800px at 50% -10%, #16203c 0%, #0b1020 60%);
        color: #e7ecf5;
      }
      .wordmark {
        font-size: 22px; font-weight: 700; letter-spacing: -0.5px;
        background: linear-gradient(135deg, #60a5fa, #22d3ee);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      }

      /* ---- step list ---- */
      .steps { display: flex; flex-direction: column; gap: 16px; width: 340px; }

      .step {
        display: flex; align-items: flex-start; gap: 14px;
        opacity: 0.3; transition: opacity 0.3s;
      }
      .step.active { opacity: 1; }
      .step.done   { opacity: 0.6; }
      .step.error  { opacity: 1; }

      .step-icon {
        width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
        margin-top: 2px; display: flex; align-items: center; justify-content: center;
        font-size: 12px; line-height: 1;
        transition: background 0.3s, border-color 0.3s;
      }
      .step.pending .step-icon { background: #1e2d4a; border: 1.5px solid #2a3a60; }
      .step.active  .step-icon {
        background: #1e3a8a; border: 1.5px solid #3b82f6;
        animation: pulse-ring 1.6s ease infinite;
      }
      .step.done    .step-icon { background: #14532d; border: 1.5px solid #16a34a; color: #86efac; }
      .step.error   .step-icon { background: #450a0a; border: 1.5px solid #dc2626; color: #fca5a5; }

      @keyframes pulse-ring {
        0%   { box-shadow: 0 0 0 0 rgba(59,130,246,.45); }
        70%  { box-shadow: 0 0 0 7px rgba(59,130,246,0); }
        100% { box-shadow: 0 0 0 0 rgba(59,130,246,0); }
      }

      .step-text { flex: 1; min-width: 0; }
      .step-label { font-size: 14px; font-weight: 500; color: #d1dff5; }
      .step.done  .step-label { color: #94a3b8; }
      .step.error .step-label { color: #fca5a5; }

      .step-detail {
        font-size: 12px; color: #6f86b0; margin-top: 3px;
        min-height: 16px; line-height: 1.4;
      }
      .step.active .step-detail { color: #93b3d8; }

      /* ---- collapsible log ---- */
      .log-wrap {
        width: 360px; max-width: 90vw;
        background: rgba(8,12,24,.8); border: 1px solid #1d2a47; border-radius: 10px;
        overflow: hidden;
      }
      .log-toggle {
        width: 100%; background: transparent; border: none; cursor: pointer;
        padding: 7px 12px; display: flex; align-items: center; justify-content: space-between;
        color: #6f86b0; font-size: 11px; user-select: none;
      }
      .log-toggle:hover { color: #9fb0d0; }
      .log-body { max-height: 0; overflow: hidden; transition: max-height 0.25s ease; }
      .log-body.open { max-height: 130px; }
      .log-inner {
        height: 130px; overflow-y: auto; padding: 8px 12px;
        font-family: ui-monospace, Menlo, "SF Mono", monospace;
        font-size: 11px; color: #6f86b0; white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div class="wordmark">BioNodulo</div>

    <div class="steps" id="steps">
      <!-- Populated by loading.js from startup:progress events -->
      <div class="step pending" id="s-check_env">
        <div class="step-icon"></div>
        <div class="step-text">
          <div class="step-label">Check Python environment</div>
          <div class="step-detail" id="d-check_env"></div>
        </div>
      </div>
      <div class="step pending" id="s-start_process">
        <div class="step-icon"></div>
        <div class="step-text">
          <div class="step-label">Start local backend</div>
          <div class="step-detail" id="d-start_process"></div>
        </div>
      </div>
      <div class="step pending" id="s-health_wait">
        <div class="step-icon"></div>
        <div class="step-text">
          <div class="step-label">Wait for backend to become ready</div>
          <div class="step-detail" id="d-health_wait"></div>
        </div>
      </div>
    </div>

    <div class="log-wrap">
      <button class="log-toggle" onclick="toggleLog(this)">
        <span>Backend logs</span><span id="log-arrow">▸</span>
      </button>
      <div class="log-body" id="log-body">
        <div class="log-inner" id="log" aria-live="polite"></div>
      </div>
    </div>

    <script src="loading.js"></script>
  </body>
</html>
