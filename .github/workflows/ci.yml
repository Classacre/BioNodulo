name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.5
        with:
          pixi-version: v0.68.1
          cache: true
      - name: Ruff check
        run: pixi run ruff check bionodulo
      - name: Ruff format check
        run: pixi run ruff format --check bionodulo

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.5
        with:
          pixi-version: v0.68.1
          cache: true
      - name: Type check with mypy
        run: pixi run mypy bionodulo --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.5
        with:
          pixi-version: v0.68.1
          cache: true
      - name: Run tests
        run: pixi run pytest tests/ -v --tb=short

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: bionodulo:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
