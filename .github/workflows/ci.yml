name: CI

on:
  push:
    branches:
      - main
      - bionodulo-collab
      - "test/**"
  pull_request:
    branches:
      - main
      - bionodulo-collab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall bionodulo server.py main.py

      - name: Run tests
        # -q not -v: this suite is 7000+ tests, and printing every name
        # buries real failures and slows log ingestion. --tb=short still
        # gives a full traceback for anything that fails.
        #
        # -n auto: run across the runner's cores. Measured locally, same
        # machine, same suite: 5m16s serial vs 3m01s parallel, with all three
        # runs (one serial, two parallel) reporting exactly 7070 passed and
        # 5 skipped — so this is a scheduling change, not a coverage change.
        # If a future test proves order-dependent, prefer fixing its shared
        # state over dropping back to serial; `--dist loadfile` is the milder
        # fallback if that is ever not practical.
        run: python -m pytest tests/ -q --tb=short -n auto

  python-quality:
    name: Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          # PIN these. An unpinned linter turns every upstream release into a
          # red build with no code change: ruff 0.16.0 enabled new default
          # rules and failed hundreds of pre-existing lines. Bump
          # deliberately, with the findings fixed in the same commit.
          python -m pip install 'ruff==0.15.13' 'mypy==2.1.0'

      - name: Ruff lint
        run: python -m ruff check bionodulo tests

      - name: Mypy type check advisory
        run: python -m mypy bionodulo --ignore-missing-imports || true

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Type-check and build
        run: npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Deliberately NOT `needs: [python, frontend]`. This job builds from
    # `context: .` and consumes no artifact from either, so the dependency was
    # pure serialisation: it waited out the slowest test leg (~15 min) before
    # starting a ~3 min build. Worse, `needs` also means "skip when they fail" —
    # which is how an unbuildable image went unnoticed for weeks while the suite
    # was red. Running it independently surfaces image breakage on its own
    # merits and takes it off the critical path.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: bionodulo:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
