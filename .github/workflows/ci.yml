name: CI

on:
  push:
    branches:
      - main
      - bionodulo-collab
      - "test/**"
  pull_request:
    branches:
      - main
      - bionodulo-collab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never on main: releases run here, and a push landing mid-build cancels the
  # per-OS jobs. That published 0.1.0-alpha.16 with no Windows installer -- and
  # because tauri-action creates the tag early, the next run's
  # check-desktop-release saw the tag, called it released and skipped, so the
  # gap was permanent. Branches and PRs still cancel, where fast feedback is
  # worth more than a complete artifact set.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall bionodulo server.py main.py

      - name: Run tests
        # -q not -v: this suite is 7000+ tests, and printing every name
        # buries real failures and slows log ingestion. --tb=short still
        # gives a full traceback for anything that fails.
        #
        # -n auto: run across the runner's cores. Measured locally, same
        # machine, same suite: 5m16s serial vs 3m01s parallel, with all three
        # runs (one serial, two parallel) reporting exactly 7070 passed and
        # 5 skipped — so this is a scheduling change, not a coverage change.
        # If a future test proves order-dependent, prefer fixing its shared
        # state over dropping back to serial; `--dist loadfile` is the milder
        # fallback if that is ever not practical.
        run: python -m pytest tests/ -q --tb=short -n auto

  python-quality:
    name: Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          # PIN these. An unpinned linter turns every upstream release into a
          # red build with no code change: ruff 0.16.0 enabled new default
          # rules and failed hundreds of pre-existing lines. Bump
          # deliberately, with the findings fixed in the same commit.
          python -m pip install 'ruff==0.15.13' 'mypy==2.1.0'

      - name: Ruff lint
        run: python -m ruff check bionodulo tests

      # Ratcheted, not advisory. `|| true` meant the count could climb forever
      # unnoticed, which is how it reached 8535. The gate only asserts that the
      # number never grows; it drops the baseline automatically when it shrinks.
      - name: Mypy ratchet
        run: python scripts/mypy_ratchet.py

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Type-check and build
        run: npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install backend
        run: python -m pip install -e ".[dev]"

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # Pinned to chromium: the suite asserts DOM and network behaviour, not
      # cross-engine rendering, so the other two engines triple the install
      # cost for no extra signal.
      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      # Vite is started by Playwright's own webServer config; the backend it
      # proxies to is started here. Several specs mock /api/* outright, but the
      # rest need a live backend, and CI must fail rather than skip when it is
      # absent -- see the CI guard in the specs.
      - name: Start backend
        run: |
          python main.py --dev --port 8765 --project-root workspace &
          for i in $(seq 1 60); do
            if curl -sf --max-time 2 http://127.0.0.1:8765/api/health >/dev/null; then
              echo "backend ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "backend failed to become healthy within 60s"
          exit 1

      - name: Run Playwright suite
        working-directory: web
        env:
          CI: "true"
        run: npx playwright test --reporter=line

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            web/test-results
            web/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Deliberately NOT `needs: [python, frontend]`. This job builds from
    # `context: .` and consumes no artifact from either, so the dependency was
    # pure serialisation: it waited out the slowest test leg (~15 min) before
    # starting a ~3 min build. Worse, `needs` also means "skip when they fail" —
    # which is how an unbuildable image went unnoticed for weeks while the suite
    # was red. Running it independently surfaces image breakage on its own
    # merits and takes it off the critical path.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: bionodulo:test
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # --- Desktop release ---------------------------------------------------
  # A version bump must release the desktop app, or it silently drifts behind
  # the editor. It reached alpha.10 while cloud served alpha.13, because
  # desktop-release.yml only fires on a `desktop-v*` tag and tagging was a
  # manual step someone had to remember after every bump.
  #
  # Deliberately NOT "push a tag and let the tag trigger the release": a tag
  # pushed with GITHUB_TOKEN does not start another workflow run, so that would
  # tag every release and build none of them. Calling the workflow keeps it in
  # this run, and tauri-action creates the tag itself alongside the release.
  check-desktop-release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      needed: ${{ steps.check.outputs.needed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Has this version been released?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./web/package.json').version")"
          # The `python` job runs test_version_consistency.py, which proves
          # every other declaration agrees with this one.
          tag="desktop-v${version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          # Keyed on what was actually PUBLISHED, not on diffing the previous
          # commit, so this is idempotent: re-runs, merges and force-pushes
          # cannot double-release, and a bump that landed while CI was red still
          # releases on the next green push instead of being skipped forever.
          #
          # A tag alone is not evidence of a release. tauri-action creates the
          # tag before the per-OS builds finish, so a cancelled or failed build
          # leaves a tagged release missing platforms -- which is how alpha.16
          # shipped without a Windows installer and could never be retried.
          # Every platform's installer must be present.
          required=(
            "_x64-setup.exe"     # Windows
            "_amd64.deb"         # Linux
            "_x64.dmg"           # macOS Intel
            "_aarch64.dmg"       # macOS Apple silicon
          )
          assets="$(gh release view "${tag}" --json assets \
            --jq '.assets[].name' 2>/dev/null || true)"

          missing=()
          for want in "${required[@]}"; do
            grep -q -- "${want}" <<<"${assets}" || missing+=("${want}")
          done

          if [ -z "${assets}" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "${tag} has no release yet."
          elif [ ${#missing[@]} -gt 0 ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "${tag} is published but incomplete; missing: ${missing[*]}"
            echo "Re-running so the absent installers are uploaded."
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "${tag} is released with every installer."
          fi

  desktop-release:
    needs: [python, python-quality, frontend, e2e, check-desktop-release]
    if: needs.check-desktop-release.outputs.needed == 'true'
    # Releasing from a red commit is worse than releasing late, hence the full
    # `needs` above.
    uses: ./.github/workflows/desktop-release.yml
    with:
      tag: ${{ needs.check-desktop-release.outputs.tag }}
    secrets: inherit
    permissions:
      contents: write
