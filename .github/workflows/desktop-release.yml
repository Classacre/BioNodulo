# Builds the Tauri desktop app (macOS/Windows/Linux) and publishes the installers
# as a GitHub Release in THIS repo — matching the updater endpoint in
# desktop/src-tauri/tauri.conf.json (Classacre/BioNodulo).
#
# Trigger: push a tag like `desktop-v0.1.0-alpha.1`, or run manually.
name: desktop-release
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

jobs:
  # The web SPA (web/dist) is platform-independent, so build it ONCE here where
  # the Linux-generated web/package-lock.json is in sync with `npm ci`. The
  # per-OS jobs download it — avoids the cross-platform `npm ci` optional-dep
  # drift (utf-8-validate) and rebuilding the SPA four times.
  build-web:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build web SPA
        working-directory: web
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  build:
    needs: build-web
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, args: "--target aarch64-apple-darwin" }
          - { os: macos-latest, args: "--target x86_64-apple-darwin" }
          - { os: ubuntu-22.04, args: "" }
          - { os: windows-latest, args: "" }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Linux webview deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"

      # Restore the prebuilt SPA into web/dist so prepare-backend bundles it.
      - name: Download prebuilt web SPA
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Install desktop tooling
        working-directory: desktop
        run: npm install

      - name: Stage backend + python + uv + icons
        working-directory: desktop
        env:
          BIONODULO_BACKEND_SRC: ${{ github.workspace }}
        run: npm run prepare:assets

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (required for createUpdaterArtifacts).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # OS code-signing is intentionally NOT wired here yet: passing empty
          # APPLE_CERTIFICATE/WINDOWS_CERTIFICATE makes tauri-action try to import
          # an empty cert and fail. Builds are unsigned (mac "unidentified
          # developer" / Windows SmartScreen). To enable, add the APPLE_* /
          # WINDOWS_CERTIFICATE secrets AND re-add the matching env vars here.
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: "BioNodulo Desktop ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
