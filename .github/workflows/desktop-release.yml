# Builds the Tauri desktop app (macOS/Windows/Linux) and publishes the installers
# as a GitHub Release in THIS repo — matching the updater endpoint in
# desktop/src-tauri/tauri.conf.json (Classacre/BioNodulo).
#
# Triggers, in order of how releases actually happen:
#   - called by ci.yml when the version on main has no release yet (the usual
#     path -- see the desktop-release job there for why it is a workflow_call
#     and not a pushed tag)
#   - push a tag like `desktop-v0.1.0-alpha.1` (manual re-release)
#   - run manually
name: desktop-release
on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag, e.g. desktop-v0.1.0-alpha.13. Created if absent."
        required: true
        type: string
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The web SPA (web/dist) is platform-independent, so build it ONCE here where
  # the Linux-generated web/package-lock.json is in sync with `npm ci`. The
  # per-OS jobs download it — avoids the cross-platform `npm ci` optional-dep
  # drift (utf-8-validate) and rebuilding the SPA four times.
  build-web:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build web SPA
        working-directory: web
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  build:
    needs: build-web
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, args: "--target aarch64-apple-darwin" }
          - { os: macos-latest, args: "--target x86_64-apple-darwin" }
          - { os: ubuntu-22.04, args: "" }
          - { os: windows-latest, args: "" }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Linux webview deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"

      # Restore the prebuilt SPA into web/dist so prepare-backend bundles it.
      - name: Download prebuilt web SPA
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Install desktop tooling
        working-directory: desktop
        run: npm install

      - name: Stage backend + python + uv + icons
        working-directory: desktop
        env:
          BIONODULO_BACKEND_SRC: ${{ github.workspace }}
        run: npm run prepare:assets

      # Apple requires EVERY nested Mach-O in the bundle to carry a Developer ID
      # signature, the hardened runtime and a secure timestamp. tauri-action
      # signs only the outer .app, so notarization rejected the bundled
      # interpreter, uv and the Python extension modules with "The executable
      # does not have the hardened runtime enabled" / "not signed with a valid
      # Developer ID certificate" / "signature does not include a secure
      # timestamp". Signing has to happen inside-out, i.e. here, BEFORE the app
      # is assembled and signed.
      - name: Sign bundled macOS binaries
        if: matrix.os == 'macos-latest'
        working-directory: desktop
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail

          # A dedicated keychain, because tauri-action imports the same
          # certificate again later and we must not disturb the login keychain.
          KEYCHAIN=bionodulo-signing.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          # Without this, codesign blocks on an interactive keychain prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null

          signed=0
          # -type f skips symlinks deliberately: codesign follows them and would
          # sign the same inode repeatedly (python/python3/python3.12 are links).
          while IFS= read -r -d '' file; do
            kind=$(file -b "$file")
            case "$kind" in
              *Mach-O*) ;;
              *) continue ;;
            esac
            # Entitlements belong on executables. Libraries and loadable bundles
            # are signed hardened but without them.
            if [[ "$kind" == *executable* ]]; then
              codesign --force --options runtime --timestamp \
                --entitlements build/entitlements.mac.plist \
                --sign "$APPLE_SIGNING_IDENTITY" "$file"
            else
              codesign --force --options runtime --timestamp \
                --sign "$APPLE_SIGNING_IDENTITY" "$file"
            fi
            signed=$((signed + 1))
          done < <(find assets -type f -print0)

          echo "Signed $signed nested Mach-O files."
          # A zero count means the layout changed and nothing got signed, which
          # would only surface later as an opaque notarization rejection.
          test "$signed" -gt 0

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (required for createUpdaterArtifacts).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code-signing + notarization. These are set ONLY on macOS
          # runners: tauri-action treats a present-but-empty APPLE_CERTIFICATE as
          # "import this certificate" and fails on Windows/Linux, which is why
          # every value is guarded by the matrix.os check rather than passed
          # unconditionally.
          #
          # All six secrets must exist or the macOS build fails at the import
          # step -- there is no partial mode. APPLE_CERTIFICATE is the base64 of
          # the Developer ID Application .p12; APPLE_CERTIFICATE_PASSWORD is the
          # password that .p12 was exported with (NOT the Apple ID password);
          # APPLE_PASSWORD is an app-specific password, not the account one.
          APPLE_CERTIFICATE: ${{ matrix.os == 'macos-latest' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.os == 'macos-latest' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}
          # Windows stays UNSIGNED: no code-signing certificate has been
          # purchased, so installers trip SmartScreen. Wiring an empty
          # WINDOWS_CERTIFICATE would fail the build rather than skip signing.
        with:
          projectPath: desktop
          # `github.ref_name` is the tag only on the tag-push path. Called from
          # ci.yml it is the branch (`main`), which would publish a release
          # named after the branch and overwrite it on every version.
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "BioNodulo Desktop ${{ inputs.tag || github.ref_name }}"
          # Both flags are load-bearing for the updater, which reads
          # releases/latest/download/latest.json (see tauri.conf.json).
          # GitHub's "latest" resolves to the most recent release that is
          # NEITHER a draft NOR a prerelease. A draft release is invisible to
          # the updater, and so is a prerelease -- verified against a live repo
          # whose newest prerelease was 9 days newer than what /releases/latest
          # returned. Alpha status is conveyed by the tag (desktop-v*-alpha.N),
          # not by the prerelease flag. Do not set either to true without first
          # moving the updater endpoint off GitHub's /releases/latest.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
