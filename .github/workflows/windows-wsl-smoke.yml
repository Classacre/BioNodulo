# Prove Windows local execution actually runs, on a real Windows host.
#
# The WSL path shipped twice with bugs that no unit test could catch: a Windows
# path handed to the Linux interpreter, and an environment set on wsl.exe that
# never reached the process inside the distribution. Both killed the backend
# instantly and left an empty log. Only running it finds that class of bug.
#
# WSL2 on GitHub-hosted runners is explicitly unsupported by GitHub (nested
# virtualization is "experimental, at your own risk"), so this job is allowed to
# fail without blocking anything. A red run here is a signal to investigate, not
# a broken main branch.
name: Windows backend smoke

on:
  workflow_dispatch:
  push:
    paths:
      - "bionodulo/**"
      - "main.py"
      - "desktop/**"
      - "desktop/src-tauri/src/wsl.rs"
      - "desktop/src-tauri/src/supervisor.rs"
      - "desktop/src-tauri/tests/wsl_smoke.rs"
      - "desktop/src-tauri/windows/**"
      - ".github/workflows/windows-wsl-smoke.yml"
  schedule:
    # Weekly, to catch runner-image changes rather than only our own.
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  # The native Windows backend, started the way the app starts it. This is the
  # path every Windows user hits before local execution is provisioned (and
  # whenever it fails), so "backend exited before becoming ready" has to be
  # caught here rather than by a user. Needs no WSL, so unlike the smoke job it
  # is reliable and blocking.
  native-backend:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install desktop tooling
        working-directory: desktop
        run: npm install

      - name: Stage backend, python and uv
        working-directory: desktop
        env:
          BIONODULO_BACKEND_SRC: ${{ github.workspace }}
        run: npm run prepare:assets

      - name: Create the environment and start the backend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $backend = "desktop/assets/bionodulo-backend"
          $uv = Get-ChildItem -Recurse -Filter uv.exe desktop/assets/uv |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $uv) { throw "bundled uv.exe not found" }

          # Use the BUNDLED interpreter, exactly as the app does. Asking uv for
          # "3.12" instead would let it download one, which is precisely the
          # step that is unavailable to an installed app -- and would hide a
          # broken bundle. A user hit:
          #   Backend exited (exit code: 103) ...
          #   No Python at '"C:\...\python-embedded\python.exe'
          # which is the Windows venv launcher failing to resolve the base
          # interpreter recorded in pyvenv.cfg.
          $embedded = Join-Path (Resolve-Path "desktop/assets/python-embedded/windows") "python.exe"
          if (-not (Test-Path $embedded)) {
            Get-ChildItem -Recurse -Depth 2 desktop/assets/python-embedded | Select-Object -First 40 FullName
            throw "bundled python.exe not found at $embedded"
          }
          & $embedded --version

          $venv = Join-Path $env:RUNNER_TEMP "venv"
          & $uv venv $venv --python $embedded --seed
          $env:VIRTUAL_ENV = $venv

          # The launcher stub reads `home` from here. A quoted or stale value is
          # what produces "No Python at ..." at runtime rather than at creation.
          $cfg = Join-Path $venv "pyvenv.cfg"
          Write-Host "=== pyvenv.cfg ==="; Get-Content $cfg
          $home_line = (Get-Content $cfg | Where-Object { $_ -match '^home\s*=' })
          if ($home_line -match '"') { throw "pyvenv.cfg home contains a quote: $home_line" }
          $home_path = ($home_line -split '=', 2)[1].Trim()
          if (-not (Test-Path $home_path)) { throw "pyvenv.cfg home does not exist: $home_path" }

          # Prove the venv's python actually launches; this is what exits 103.
          & (Join-Path $venv "Scripts/python.exe") --version
          if ($LASTEXITCODE -ne 0) { throw "venv python failed to start (exit $LASTEXITCODE)" }
          & $uv pip install -e $backend --index-strategy unsafe-best-match

          $py = Join-Path $venv "Scripts/python.exe"
          $workspace = Join-Path $env:RUNNER_TEMP "workspace"
          New-Item -ItemType Directory -Force -Path $workspace | Out-Null

          $env:PYTHONPATH = (Resolve-Path $backend).Path
          $env:PYTHONUNBUFFERED = "1"
          $out = Join-Path $env:RUNNER_TEMP "backend.log"
          $proc = Start-Process -FilePath $py -PassThru -NoNewWindow `
            -RedirectStandardOutput $out -RedirectStandardError "$out.err" `
            -ArgumentList @(
              (Join-Path (Resolve-Path $backend).Path "main.py"),
              "--host", "127.0.0.1", "--port", "8188",
              "--project-root", $workspace
            )

          # Poll exactly as the supervisor does, and report what the process
          # printed rather than "check the logs" if it dies.
          $ok = $false
          foreach ($i in 1..120) {
            if ($proc.HasExited) { break }
            try {
              $r = Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 `
                "http://127.0.0.1:8188/api/health"
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
            Start-Sleep -Milliseconds 500
          }
          if (-not $ok) {
            Write-Host "=== stdout ==="; Get-Content $out -ErrorAction SilentlyContinue
            Write-Host "=== stderr ==="; Get-Content "$out.err" -ErrorAction SilentlyContinue
            throw "backend never answered on 127.0.0.1:8188"
          }
          Write-Host "backend answered"
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

  smoke:
    runs-on: windows-latest
    # Unsupported platform capability: report, never block.
    continue-on-error: true
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Report WSL status
        id: wsl
        shell: pwsh
        run: |
          # wsl.exe exits non-zero when the feature is absent, so tolerate it
          # here and decide from the output rather than failing the step.
          $ErrorActionPreference = "Continue"
          wsl.exe --status 2>&1 | Out-String | Write-Host
          wsl.exe --version 2>&1 | Out-String | Write-Host
          $listed = (wsl.exe --list --quiet 2>&1 | Out-String)
          Write-Host "distributions: $listed"

      - name: Enable WSL2 if the runner image lacks it
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          wsl.exe --status *> $null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "WSL not usable; attempting to enable it."
            # The runner is already elevated, so this mirrors what the NSIS
            # installer hook does on a user's machine.
            wsl.exe --install --no-distribution 2>&1 | Out-String | Write-Host
            wsl.exe --set-default-version 2 2>&1 | Out-String | Write-Host
          } else {
            Write-Host "WSL is already usable."
          }
          wsl.exe --update 2>&1 | Out-String | Write-Host

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The Tauri build script resolves bundle resources at compile time, so
      # the staged uv/python/backend must exist even though this test never
      # uses them -- it runs Python from inside the distribution.
      - name: Install desktop tooling
        working-directory: desktop
        run: npm install

      - name: Stage backend, python and uv
        working-directory: desktop
        env:
          BIONODULO_BACKEND_SRC: ${{ github.workspace }}
        run: npm run prepare:assets

      - name: Run the WSL smoke test
        shell: pwsh
        working-directory: desktop/src-tauri
        run: |
          cargo test --test wsl_smoke -- --ignored --nocapture --test-threads=1

      - name: Collect diagnostics on failure
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          wsl.exe --list --verbose 2>&1 | Out-String | Write-Host
          wsl.exe -d BioNodulo --exec ls -la /opt/bionodulo 2>&1 | Out-String | Write-Host
          wsl.exe -d BioNodulo --exec /opt/bionodulo/venv/bin/python -V 2>&1 |
            Out-String | Write-Host

      - name: Remove the distribution
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          wsl.exe --unregister BioNodulo 2>&1 | Out-String | Write-Host
