# Prove Windows local execution actually runs, on a real Windows host.
#
# The WSL path shipped twice with bugs that no unit test could catch: a Windows
# path handed to the Linux interpreter, and an environment set on wsl.exe that
# never reached the process inside the distribution. Both killed the backend
# instantly and left an empty log. Only running it finds that class of bug.
#
# WSL2 on GitHub-hosted runners is explicitly unsupported by GitHub (nested
# virtualization is "experimental, at your own risk"), so this job is allowed to
# fail without blocking anything. A red run here is a signal to investigate, not
# a broken main branch.
name: Windows backend smoke

on:
  workflow_dispatch:
  push:
    paths:
      - "bionodulo/**"
      - "main.py"
      - "desktop/**"
      - "desktop/src-tauri/src/wsl.rs"
      - "desktop/src-tauri/src/paths.rs"
      - "desktop/src-tauri/src/provision.rs"
      - "desktop/src-tauri/src/supervisor.rs"
      - "desktop/src-tauri/tests/wsl_smoke.rs"
      - "desktop/src-tauri/tests/venv_recovery.rs"
      - "desktop/src-tauri/windows/**"
      - ".github/workflows/windows-wsl-smoke.yml"
  schedule:
    # Weekly, to catch runner-image changes rather than only our own.
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  # The native Windows backend, started the way the app starts it. This is the
  # path every Windows user hits before local execution is provisioned (and
  # whenever it fails), so "backend exited before becoming ready" has to be
  # caught here rather than by a user. Needs no WSL, so unlike the smoke job it
  # is reliable and blocking.
  native-backend:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install desktop tooling
        working-directory: desktop
        run: npm install

      - name: Stage backend, python and uv
        working-directory: desktop
        env:
          BIONODULO_BACKEND_SRC: ${{ github.workspace }}
        run: npm run prepare:assets

      - name: Create the environment and start the backend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $backend = "desktop/assets/bionodulo-backend"
          $uv = Get-ChildItem -Recurse -Filter uv.exe desktop/assets/uv |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $uv) { throw "bundled uv.exe not found" }

          # Use the BUNDLED interpreter, exactly as the app does. Asking uv for
          # "3.12" instead would let it download one, which is precisely the
          # step that is unavailable to an installed app -- and would hide a
          # broken bundle. A user hit:
          #   Backend exited (exit code: 103) ...
          #   No Python at '"C:\...\python-embedded\python.exe'
          # which is the Windows venv launcher failing to resolve the base
          # interpreter recorded in pyvenv.cfg.
          $embedded = Join-Path (Resolve-Path "desktop/assets/python-embedded/windows") "python.exe"
          if (-not (Test-Path $embedded)) {
            Get-ChildItem -Recurse -Depth 2 desktop/assets/python-embedded | Select-Object -First 40 FullName
            throw "bundled python.exe not found at $embedded"
          }
          & $embedded --version

          $venv = Join-Path $env:RUNNER_TEMP "venv"
          & $uv venv $venv --python $embedded --seed
          $env:VIRTUAL_ENV = $venv

          # The launcher stub reads `home` from here. A quoted or stale value is
          # what produces "No Python at ..." at runtime rather than at creation.
          $cfg = Join-Path $venv "pyvenv.cfg"
          Write-Host "=== pyvenv.cfg ==="; Get-Content $cfg
          $home_line = (Get-Content $cfg | Where-Object { $_ -match '^home\s*=' })
          if ($home_line -match '"') { throw "pyvenv.cfg home contains a quote: $home_line" }
          $home_path = ($home_line -split '=', 2)[1].Trim()
          if (-not (Test-Path $home_path)) { throw "pyvenv.cfg home does not exist: $home_path" }

          # Prove the venv's python actually launches; this is what exits 103.
          & (Join-Path $venv "Scripts/python.exe") --version
          if ($LASTEXITCODE -ne 0) { throw "venv python failed to start (exit $LASTEXITCODE)" }
          & $uv pip install -e $backend --index-strategy unsafe-best-match

          $py = Join-Path $venv "Scripts/python.exe"
          $workspace = Join-Path $env:RUNNER_TEMP "workspace"
          New-Item -ItemType Directory -Force -Path $workspace | Out-Null

          $env:PYTHONPATH = (Resolve-Path $backend).Path
          $env:PYTHONUNBUFFERED = "1"
          $out = Join-Path $env:RUNNER_TEMP "backend.log"
          $proc = Start-Process -FilePath $py -PassThru -NoNewWindow `
            -RedirectStandardOutput $out -RedirectStandardError "$out.err" `
            -ArgumentList @(
              (Join-Path (Resolve-Path $backend).Path "main.py"),
              "--host", "127.0.0.1", "--port", "8188",
              "--project-root", $workspace
            )

          # Poll exactly as the supervisor does, and report what the process
          # printed rather than "check the logs" if it dies.
          $ok = $false
          foreach ($i in 1..120) {
            if ($proc.HasExited) { break }
            try {
              $r = Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 `
                "http://127.0.0.1:8188/api/health"
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
            Start-Sleep -Milliseconds 500
          }
          if (-not $ok) {
            Write-Host "=== stdout ==="; Get-Content $out -ErrorAction SilentlyContinue
            Write-Host "=== stderr ==="; Get-Content "$out.err" -ErrorAction SilentlyContinue
            throw "backend never answered on 127.0.0.1:8188"
          }
          Write-Host "backend answered"
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

  # Whether the app's OWN decision about a stale environment matches uv's.
  #
  # `provisioning-shape` below proves uv fails when the recorded interpreter is
  # gone, and that rebuilding recovers -- but it proves it in PowerShell, about
  # nothing the app runs. The app's check has only ever been tested against
  # hand-written `pyvenv.cfg` files, so "the key uv writes is the key uv reads
  # back, and the one we test" stayed an assumption. This runs the shipped
  # `paths::venv_is_usable` against a real uv venv whose base was removed, and
  # requires uv to name the same path.
  venv-recovery:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install desktop tooling
        working-directory: desktop
        run: npm install

      - name: Stage backend, python and uv
        working-directory: desktop
        env:
          BIONODULO_BACKEND_SRC: ${{ github.workspace }}
        run: npm run prepare:assets

      - name: Reject a venv whose base interpreter is gone
        working-directory: desktop/src-tauri
        run: cargo test --test venv_recovery -- --ignored --nocapture

  # Installing with NO temporary build environment, which is the last resort
  # when the machine cannot make one.
  #
  # Four reports, all the same line: `Failed to create temporary virtualenv`.
  # The final one came from a venv whose pyvenv.cfg named the correct, present,
  # bundled interpreter, so the fault was not in the venv at all. A matrix run
  # on a clean Windows host ruled out every ambient setting that could steer
  # uv's discovery -- UV_PYTHON, the stale directory on PATH, a PEP 514 registry
  # entry, `.python-version`, `uv.toml` -- and an in-place rebuild at a fixed
  # path installed cleanly, so it is not the interpreter cache either. Whatever
  # remains is local to that machine and cannot be enumerated remotely.
  #
  # So stop making that step work and stop performing it. This proves the
  # fallback the app now takes: seed the build backend into the environment
  # itself, then install with --no-build-isolation. If this passes, an install
  # can complete on a machine where creating a build environment is impossible.
  no-build-isolation:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install desktop tooling
        working-directory: desktop
        run: npm install

      - name: Stage backend, python and uv
        working-directory: desktop
        env:
          BIONODULO_BACKEND_SRC: ${{ github.workspace }}
        run: npm run prepare:assets

      - name: Install the backend without an isolated build environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $uv = Get-ChildItem -Recurse -Filter uv.exe desktop/assets/uv |
            Select-Object -First 1 -ExpandProperty FullName
          $bundled = Join-Path (Resolve-Path "desktop/assets/python-embedded/windows") "python.exe"
          $src = (Resolve-Path "desktop/assets/bionodulo-backend").Path

          $venv = Join-Path $env:RUNNER_TEMP "venv-nbi"
          & $uv venv $venv --python $bundled --seed
          # Exactly the environment the app gives uv.
          $env:VIRTUAL_ENV = $venv
          $env:UV_PYTHON_PREFERENCE = "only-system"
          $env:UV_NO_PROGRESS = "1"
          $env:UV_NO_CONFIG = "1"
          $env:UV_CACHE_DIR = Join-Path $env:RUNNER_TEMP "uv-cache-nbi"

          # The build backend has to be present in the environment itself,
          # because there is no isolated one to put it in.
          & $uv pip install hatchling --index-strategy unsafe-best-match
          if ($LASTEXITCODE -ne 0) { throw "seeding the build backend failed" }

          & $uv pip install -e $src --no-build-isolation --index-strategy unsafe-best-match
          if ($LASTEXITCODE -ne 0) { throw "the no-build-isolation install failed" }

          # Installed is not the same as importable.
          & (Join-Path $venv "Scripts/python.exe") -c "import bionodulo, uvicorn, fastapi; print(bionodulo.__version__)"
          if ($LASTEXITCODE -ne 0) { throw "the backend does not import after installing" }

  provisioning-shape:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install desktop tooling
        working-directory: desktop
        run: npm install

      - name: Stage backend, python and uv
        working-directory: desktop
        env:
          BIONODULO_BACKEND_SRC: ${{ github.workspace }}
        run: npm run prepare:assets

      - name: Install from each path shape
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $uv = Get-ChildItem -Recurse -Filter uv.exe desktop/assets/uv |
            Select-Object -First 1 -ExpandProperty FullName
          $embedded = Join-Path (Resolve-Path "desktop/assets/python-embedded/windows") "python.exe"
          $src = (Resolve-Path "desktop/assets/bionodulo-backend").Path

          # A directory whose name contains a space, like "Program Files".
          $spaced = Join-Path $env:RUNNER_TEMP "With Space\BioNodulo"
          New-Item -ItemType Directory -Force -Path $spaced | Out-Null
          Copy-Item -Recurse -Force "$src" (Join-Path $spaced "bionodulo-backend")
          $spacedBackend = Join-Path $spaced "bionodulo-backend"

          $variants = @(
            @{ name = "plain path (what CI already covers)"; path = $src },
            @{ name = "path containing a space";             path = $spacedBackend },
            @{ name = "extended-length prefix";              path = "\\?\$src" },
            @{ name = "extended-length + space (shipped)";   path = "\\?\$spacedBackend" }
          )

          $results = @()
          foreach ($v in $variants) {
            $venv = Join-Path $env:RUNNER_TEMP ("venv-" + [guid]::NewGuid().ToString("N").Substring(0,8))
            & $uv venv $venv --python $embedded --seed *> $null
            $env:VIRTUAL_ENV = $venv
            Write-Host "=== $($v.name) ==="
            Write-Host "    path: $($v.path)"
            $out = & $uv pip install -e $v.path --index-strategy unsafe-best-match 2>&1 | Out-String
            $code = $LASTEXITCODE
            Write-Host $out
            $results += [pscustomobject]@{
              Variant = $v.name
              Exit    = $code
              Error   = ($out -split "`n" | Where-Object { $_ -match "error|Error|ERROR" } | Select-Object -First 1)
            }
          }

          # A read-only source tree. The installed app lives under Program
          # Files, which a non-elevated process cannot write to, and CI runs
          # elevated -- so this is the difference the job above cannot see.
          $ro = Join-Path $env:RUNNER_TEMP "ReadOnly\\BioNodulo"
          New-Item -ItemType Directory -Force -Path $ro | Out-Null
          Copy-Item -Recurse -Force "$src" (Join-Path $ro "bionodulo-backend")
          $roBackend = Join-Path $ro "bionodulo-backend"
          # Model Program Files: readable by everyone, not writable.
          #
          # Two earlier attempts got this wrong and denied reads instead.
          # `/inheritance:r` dropped the running account's access outright, and
          # icacls' simple `(W)` right expands to FILE_GENERIC_WRITE, which
          # includes SYNCHRONIZE -- and every synchronous file open asks for
          # SYNCHRONIZE, so denying W denies opening the file at all. Specific
          # rights only: write data, append, write EA, write attributes.
          icacls $roBackend /deny "*S-1-1-0:(OI)(CI)(WD,AD,WEA,WA)" /T /Q | Out-Null

          # Prove the tree is still readable, so a failure below is about
          # writing rather than another self-inflicted ACL.
          Get-Content (Join-Path $roBackend "pyproject.toml") -TotalCount 1 | Out-Null
          Write-Host "read-only tree is readable: yes"

          foreach ($mode in @("editable", "copied")) {
            $venv = Join-Path $env:RUNNER_TEMP "venv-ro-$mode"
            & $uv venv $venv --python $embedded --seed *> $null
            $env:VIRTUAL_ENV = $venv
            Write-Host "=== read-only source tree, $mode install ==="
            if ($mode -eq "editable") {
              $out = & $uv pip install -e $roBackend --index-strategy unsafe-best-match 2>&1 | Out-String
            } else {
              $out = & $uv pip install $roBackend --index-strategy unsafe-best-match 2>&1 | Out-String
            }
            $code = $LASTEXITCODE
            Write-Host $out
            $results += [pscustomobject]@{
              Variant = "read-only source, $mode"
              Exit    = $code
              Error   = ($out -split "`n" | Where-Object { $_ -match "error|denied" } | Select-Object -First 1)
            }
          }
          icacls $roBackend /remove:d "*S-1-1-0" /T /Q | Out-Null

          # Long paths. Runners ship with LongPathsEnabled=1; a default Windows
          # install has it off, so any path over 260 chars fails there and
          # nowhere else.
          $key = "HKLM:\\SYSTEM\\CurrentControlSet\\Control\\FileSystem"
          $lp = (Get-ItemProperty -Path $key -Name LongPathsEnabled -ErrorAction SilentlyContinue).LongPathsEnabled
          Write-Host "LongPathsEnabled on this runner: $lp"

          # Turn it off, which is the Windows default a user actually has, and
          # install again. This is the last difference between the runner and a
          # normal machine that CI can control.
          Set-ItemProperty -Path $key -Name LongPathsEnabled -Value 0
          $venv = Join-Path $env:RUNNER_TEMP "venv-nolongpath"
          & $uv venv $venv --python $embedded --seed *> $null
          $env:VIRTUAL_ENV = $venv
          Write-Host "=== LongPathsEnabled=0 ==="
          $out = & $uv pip install -e $src --index-strategy unsafe-best-match 2>&1 | Out-String
          $lpCode = $LASTEXITCODE
          Write-Host $out
          $results += [pscustomobject]@{
            Variant = "LongPathsEnabled=0"
            Exit    = $lpCode
            Error   = ($out -split "`n" | Where-Object { $_ -match "error|denied|too long" } | Select-Object -First 1)
          }
          Set-ItemProperty -Path $key -Name LongPathsEnabled -Value $lp

          # An upgrade that moves the bundled interpreter leaves a venv whose
          # pyvenv.cfg names a path that is gone. Second time this class has
          # shipped, so pin it.
          #
          # This produces the LAUNCHER-STUB variant: Scripts/python.exe exits
          # 103 with "No Python at ...". A user hit the other variant, where
          # the venv starts perfectly and only build isolation fails:
          #   Failed to create temporary virtualenv
          #   Could not find a suitable Python executable ... based on the
          #   interpreter: ...\AppData\Local\BioNodulo\python-embedded\python.exe
          # Which one you get depends on how the venv was built. Both come from
          # the same dead recorded base, and both are caught by checking that
          # base exists rather than by starting the venv.
          $moved = Join-Path $env:RUNNER_TEMP "moved-python"
          Copy-Item -Recurse -Force (Split-Path $embedded -Parent) $moved
          $movedPy = Join-Path $moved "python.exe"
          $venv = Join-Path $env:RUNNER_TEMP "venv-stalebase"
          & $uv venv $venv --python $movedPy --seed *> $null
          $env:VIRTUAL_ENV = $venv

          # The upgrade: the interpreter it was built from goes away.
          Remove-Item -Recurse -Force $moved

          Write-Host "=== venv whose base interpreter was removed ==="
          & (Join-Path $venv "Scripts/python.exe") --version
          Write-Host "    venv itself starts: exit $LASTEXITCODE (this is why the old probe passed)"
          $out = & $uv pip install -e $src --index-strategy unsafe-best-match 2>&1 | Out-String
          $staleCode = $LASTEXITCODE
          Write-Host $out
          if ($staleCode -eq 0) {
            throw "expected a stale base interpreter to break the build; it did not"
          }
          Write-Host "reproduced: exit $staleCode"

          # And rebuilding recovers, which is what the app now does.
          Remove-Item -Recurse -Force $venv
          & $uv venv $venv --python $embedded --seed *> $null
          $out = & $uv pip install -e $src --index-strategy unsafe-best-match 2>&1 | Out-String
          $results += [pscustomobject]@{
            Variant = "rebuilt after stale base"
            Exit    = $LASTEXITCODE
            Error   = ($out -split "`n" | Where-Object { $_ -match "error" } | Select-Object -First 1)
          }

          Write-Host "`n================ SUMMARY ================"
          $results | Format-Table -AutoSize -Wrap | Out-String | Write-Host
          if ($results | Where-Object { $_.Exit -ne 0 }) {
            throw "at least one shape fails; see the summary above"
          }

  smoke:
    runs-on: windows-latest
    # Unsupported platform capability: report, never block.
    continue-on-error: true
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Report WSL status
        id: wsl
        shell: pwsh
        run: |
          # wsl.exe exits non-zero when the feature is absent, so tolerate it
          # here and decide from the output rather than failing the step.
          $ErrorActionPreference = "Continue"
          wsl.exe --status 2>&1 | Out-String | Write-Host
          wsl.exe --version 2>&1 | Out-String | Write-Host
          $listed = (wsl.exe --list --quiet 2>&1 | Out-String)
          Write-Host "distributions: $listed"

      - name: Enable WSL2 if the runner image lacks it
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          wsl.exe --status *> $null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "WSL not usable; attempting to enable it."
            # The runner is already elevated, so this mirrors what the NSIS
            # installer hook does on a user's machine.
            wsl.exe --install --no-distribution 2>&1 | Out-String | Write-Host
            wsl.exe --set-default-version 2 2>&1 | Out-String | Write-Host
          } else {
            Write-Host "WSL is already usable."
          }
          wsl.exe --update 2>&1 | Out-String | Write-Host

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The Tauri build script resolves bundle resources at compile time, so
      # the staged uv/python/backend must exist even though this test never
      # uses them -- it runs Python from inside the distribution.
      - name: Install desktop tooling
        working-directory: desktop
        run: npm install

      - name: Stage backend, python and uv
        working-directory: desktop
        env:
          BIONODULO_BACKEND_SRC: ${{ github.workspace }}
        run: npm run prepare:assets

      - name: Run the WSL smoke test
        shell: pwsh
        working-directory: desktop/src-tauri
        run: |
          cargo test --test wsl_smoke -- --ignored --nocapture --test-threads=1

      - name: Collect diagnostics on failure
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          wsl.exe --list --verbose 2>&1 | Out-String | Write-Host
          wsl.exe -d BioNodulo --exec ls -la /opt/bionodulo 2>&1 | Out-String | Write-Host
          wsl.exe -d BioNodulo --exec /opt/bionodulo/venv/bin/python -V 2>&1 |
            Out-String | Write-Host

      - name: Remove the distribution
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          wsl.exe --unregister BioNodulo 2>&1 | Out-String | Write-Host
